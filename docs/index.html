<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTMiIGZpbGw9IiMxNzRlNDgiLz48dGV4dCB4PSIyNCIgeT0iMzMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMjgiIGZpbGw9IndoaXRlIj7otKY8L3RleHQ+PC9zdmc+" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#174e48" />
    <title>本地账本 · 餐饮店交互演示</title>
    <style>
      :root {
        --bg: #f5f6f2;
        --paper: #fff;
        --ink: #253c36;
        --muted: #77847d;
        --green: #174e48;
        --soft: #e9f2ec;
        --line: #e5eae5;
        --orange: #a46b24;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a.btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        color: var(--ink);
        padding: 10px 16px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      button:hover,
      a.btn:hover {
        border-color: #87aaa0;
        background: #f3f8f3;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary,
      a.primary {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #aac8b6;
        outline-offset: 2px;
      }
      .shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        padding: 30px 18px;
        background: #fff;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 20px;
        font-weight: 700;
        padding: 0 10px;
      }
      .logo {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--green);
        color: white;
      }
      .sidebar small {
        display: block;
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--muted);
        font-weight: 400;
      }
      .nav {
        display: grid;
        gap: 8px;
      }
      .nav button {
        justify-content: start;
        border: 0;
        padding: 13px 16px;
        color: #75827c;
      }
      .nav button.active {
        background: var(--soft);
        color: var(--green);
        font-weight: 600;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 18px 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .sidebar-foot a {
        color: var(--green);
      }
      main {
        min-width: 0;
        padding: 34px 42px;
      }
      .demo-banner {
        padding: 11px 16px;
        background: #fbf8ea;
        border: 1px solid #eee6c5;
        border-radius: 11px;
        color: #8a733d;
        font-size: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .demo-banner b {
        font-size: 12px;
        white-space: nowrap;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 28px 0;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--muted);
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
        margin: 6px 0;
      }
      h2 {
        font-size: 16px;
        margin: 0;
      }
      p {
        margin: 8px 0;
      }
      .subtitle,
      .muted {
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 22px;
      }
      .card,
      .panel {
        border: 1px solid var(--line);
        background: white;
        border-radius: 18px;
        box-shadow: 0 8px 30px #253c3603;
        min-width: 0;
      }
      .card {
        padding: 22px;
      }
      .card.featured {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
      }
      .card.featured .label,
      .card.featured small {
        color: #c7d9d1;
      }
      .metric {
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -1px;
        margin: 13px 0 10px;
        font-variant-numeric: tabular-nums;
      }
      .metric i {
        font-size: 16px;
        font-style: normal;
        margin-right: 3px;
      }
      .card small {
        font-size: 11px;
        color: var(--muted);
      }
      .two-col {
        grid-template-columns: 1.2fr 1fr;
        margin-bottom: 22px;
      }
      .panel-head {
        padding: 20px 23px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
      }
      .panel-head small {
        color: var(--muted);
        font-size: 11px;
      }
      .panel-body {
        padding: 22px 24px;
      }
      .bar {
        margin-bottom: 20px;
      }
      .bar:last-child {
        margin-bottom: 0;
      }
      .bar-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .bar-track {
        height: 8px;
        background: #edf2ed;
        border-radius: 20px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 20px;
        background: #8bb69c;
      }
      .bar:nth-child(2) .bar-fill {
        background: #c3d4b4;
      }
      .tips {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 13px;
      }
      .tips li {
        margin-bottom: 12px;
      }
      .tips li:last-child {
        margin: 0;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        background: #fafbf9;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }
      th,
      td {
        padding: 16px 22px;
        border-bottom: 1px solid #eef1ed;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      td strong {
        font-weight: 550;
      }
      td small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .amount {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .income {
        color: #3f8964;
      }
      .expense {
        color: var(--ink);
      }
      .tag {
        display: inline-block;
        padding: 3px 8px;
        font-size: 11px;
        border-radius: 6px;
        background: #f1f4ee;
        color: #6f7e6f;
      }
      .tag.warn {
        background: #fff3dd;
        color: var(--orange);
      }
      .tag.good {
        background: #eaf4ed;
        color: #42805f;
      }
      .search {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      input,
      select {
        min-width: 0;
        border: 1px solid #dce5dd;
        background: white;
        border-radius: 9px;
        padding: 10px 12px;
        color: var(--ink);
        width: 100%;
      }
      .search input {
        flex: 1;
        min-width: 160px;
      }
      .search select {
        width: auto;
        min-width: 100px;
      }
      .footer-note {
        font-size: 11px;
        color: var(--muted);
        margin: 22px 0;
      }
      .footer-note a {
        color: var(--green);
      }
      .pos-grid {
        grid-template-columns: 1.2fr 1fr;
      }
      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .dish {
        display: flex;
        align-items: start;
        flex-direction: column;
        gap: 12px;
        text-align: left;
        padding: 20px;
        min-height: 126px;
      }
      .dish b {
        font-size: 21px;
        color: var(--green);
      }
      .dish small {
        color: var(--muted);
        font-size: 11px;
      }
      .cart-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .cart-row small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .qty button {
        padding: 4px 10px;
      }
      .cart-total {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 24px 0;
      }
      .cart-total strong {
        font-size: 29px;
      }
      .full {
        width: 100%;
      }
      .empty {
        padding: 30px;
        color: var(--muted);
        text-align: center;
      }
      .form-field {
        display: grid;
        gap: 7px;
        margin-bottom: 15px;
        font-size: 12px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .notice {
        padding: 12px 15px;
        background: #faf8ed;
        border: 1px solid #eee7cb;
        border-radius: 10px;
        color: #8a763f;
        font-size: 12px;
        margin-bottom: 18px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #20382f55;
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 10;
      }
      .modal {
        background: white;
        border-radius: 20px;
        width: 520px;
        max-width: 100%;
        max-height: 90vh;
        overflow: auto;
        box-shadow: 0 20px 80px #12382c33;
      }
      .modal-head {
        position: sticky;
        top: 0;
        background: white;
        padding: 18px 23px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1;
      }
      .modal-body {
        padding: 22px 24px;
      }
      .modal-head button {
        border: 0;
        padding: 2px 7px;
        font-size: 23px;
        color: var(--muted);
      }
      .form-error {
        color: #a34f3f;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .ticket {
        max-width: 74mm;
        margin: auto;
        color: #111;
        background: white;
        font: 12px/1.7 sans-serif;
        overflow-wrap: anywhere;
      }
      .ticket h2,
      .ticket h3 {
        text-align: center;
      }
      .ticket h3 {
        font-size: 14px;
      }
      .ticket th,
      .ticket td {
        padding: 6px 2px;
        font-size: 11px;
        background: white;
        color: #111;
        white-space: normal;
      }
      .ticket th:not(:first-child),
      .ticket td:not(:first-child) {
        text-align: right;
        white-space: nowrap;
      }
      .ticket .ticket-total {
        text-align: right;
        font-size: 19px;
        font-weight: 700;
        margin: 14px 0;
      }
      .toast {
        position: fixed;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        background: #24483d;
        color: white;
        border-radius: 11px;
        padding: 13px 20px;
        max-width: calc(100vw - 30px);
        font-size: 12px;
        box-shadow: 0 9px 30px #0002;
        z-index: 20;
      }
      .reset {
        background: none;
        border: 0;
        padding: 0;
        color: #887136;
        font-size: 11px;
        white-space: nowrap;
      }
      @media (max-width: 1050px) {
        main {
          padding: 28px 24px;
        }
        .shell {
          grid-template-columns: 185px minmax(0, 1fr);
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .two-col,
        .pos-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 650px) {
        .shell {
          display: block;
        }
        .sidebar {
          padding: 18px 18px 12px;
          gap: 17px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          font-size: 18px;
        }
        .sidebar-foot {
          display: none;
        }
        .nav {
          display: flex;
          overflow: auto;
          gap: 3px;
        }
        .nav button {
          padding: 8px 11px;
          white-space: nowrap;
          font-size: 12px;
          flex-shrink: 0;
        }
        main {
          padding: 20px 17px 60px;
        }
        .demo-banner {
          align-items: start;
          gap: 8px;
          font-size: 11px;
        }
        .demo-banner b {
          display: block;
        }
        .topbar {
          align-items: start;
          flex-direction: column;
          margin: 22px 0;
        }
        h1 {
          font-size: 25px;
        }
        .subtitle {
          font-size: 12px;
        }
        .card {
          padding: 17px;
        }
        .metric {
          font-size: 27px;
        }
        .stats {
          gap: 12px;
        }
        .panel-head {
          padding: 17px;
        }
        .panel-body {
          padding: 18px;
        }
        .mobile-hide {
          display: none;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .menu-grid {
          gap: 12px;
        }
        .dish {
          padding: 16px;
        }
        .modal-body {
          padding: 19px;
        }
        .modal-head {
          padding: 16px 19px;
        }
        th,
        td {
          padding: 14px 16px;
        }
        .toast {
          bottom: 16px;
        }
      }
      @media print {
        @page {
          size: 80mm auto;
          margin: 3mm;
        }
        body {
          background: white;
        }
        .shell,
        .toast,
        .modal-head,
        .print-tools {
          display: none !important;
        }
        .modal-backdrop,
        .modal,
        .modal-body {
          position: static;
          display: block;
          padding: 0;
          margin: 0;
          width: auto;
          max-width: none;
          max-height: none;
          overflow: visible;
          background: white;
          box-shadow: none;
          border: 0;
        }
        .ticket {
          width: 74mm;
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">账</span>
          <div>本地账本<small>LOCAL LEDGER · DEMO</small></div>
        </div>
        <nav class="nav" aria-label="演示导航">
          <button data-page="overview">◫ 总览</button
          ><button data-page="ledger">▤ 收支账目</button
          ><button data-page="pos">▣ 模拟收银</button
          ><button data-page="inventory">▧ 原料库存</button
          ><button data-page="orders">▥ 销售小票</button>
        </nav>
        <div class="sidebar-foot">
          让每一笔经营都有迹可循。
          <p>此页面使用虚构数据。</p>
          <a
            href="https://github.com/rookiemanui/codex"
            target="_blank"
            rel="noopener"
            >查看项目与完整版 ↗</a
          >
        </div>
      </aside>
      <main>
        <div class="demo-banner">
          <div>
            <b>交互演示</b>
            使用测试数据，操作只在当前标签页生效；刷新会还原，不会发生真实扣款。
          </div>
          <button class="reset" id="reset">重置演示</button>
        </div>
        <div id="content"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast" role="status" hidden></div>
    <script>
      "use strict";
      const $ = (s, r = document) => r.querySelector(s),
        $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (c) =>
        (c / 100).toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const qty = (m) =>
        (m / 1000).toLocaleString("zh-CN", { maximumFractionDigits: 3 });
      const date = "2026-10-19";
      let page = "overview",
        cart = [],
        state,
        toastTimer;
      const dishes = [
        {
          id: "chicken",
          name: "宫保鸡丁",
          price: 1800,
          code: "1001",
          recipe: { chicken: 200 },
        },
        {
          id: "tomato",
          name: "番茄炒蛋",
          price: 1200,
          code: "1002",
          recipe: { tomato: 150 },
        },
        {
          id: "rice",
          name: "米饭",
          price: 200,
          code: "1003",
          recipe: { rice: 100 },
        },
      ];
      function seed() {
        state = {
          transactions: [
            {
              id: "e1",
              kind: "expense",
              amount: 5640,
              purpose: "鸡肉、蔬菜采购",
              category: "食材采购",
              account: "微信收款",
              time: date + " 09:00",
            },
            {
              id: "e2",
              kind: "expense",
              amount: 1200,
              purpose: "调料采购",
              category: "调料采购",
              account: "现金",
              time: date + " 09:15",
            },
            {
              id: "s1",
              kind: "income",
              amount: 4800,
              purpose: "销售小票 DEMO-001",
              category: "销售收款",
              account: "微信收款",
              time: date + " 12:05",
            },
            {
              id: "s2",
              kind: "income",
              amount: 7200,
              purpose: "销售小票 DEMO-002",
              category: "销售收款",
              account: "现金",
              time: date + " 12:15",
            },
          ],
          stock: [
            {
              id: "chicken",
              name: "鸡肉",
              code: "R001",
              milli: 4200,
              minimum: 2000,
              unit: "千克",
            },
            {
              id: "tomato",
              name: "番茄",
              code: "R002",
              milli: 2550,
              minimum: 3000,
              unit: "千克",
            },
            {
              id: "rice",
              name: "大米",
              code: "R003",
              milli: 1400,
              minimum: 1000,
              unit: "千克",
            },
          ],
          orders: [
            {
              number: "DEMO-001",
              time: date + " 12:05",
              account: "微信收款",
              lines: [
                { name: "宫保鸡丁", price: 1800, quantity: 2 },
                { name: "米饭", price: 200, quantity: 6 },
              ],
              total: 4800,
            },
            {
              number: "DEMO-002",
              time: date + " 12:15",
              account: "现金",
              lines: [
                { name: "番茄炒蛋", price: 1200, quantity: 3 },
                { name: "宫保鸡丁", price: 1800, quantity: 2 },
              ],
              total: 7200,
            },
          ],
        };
        cart = [];
      }
      function toast(text) {
        clearTimeout(toastTimer);
        $("#toast").textContent = text;
        $("#toast").hidden = false;
        toastTimer = setTimeout(() => ($("#toast").hidden = true), 4000);
      }
      function totals() {
        const income = state.transactions
            .filter((x) => x.kind === "income")
            .reduce((s, x) => s + x.amount, 0),
          expense = state.transactions
            .filter((x) => x.kind === "expense")
            .reduce((s, x) => s + x.amount, 0);
        return {
          income,
          expense,
          net: income - expense,
          low: state.stock.filter((x) => x.milli <= x.minimum).length,
        };
      }
      function header(title, subtitle, actions = "") {
        return `<header class="topbar"><div><div class="eyebrow">LOCAL LEDGER / 餐饮店演示</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></header>`;
      }
      function txTable(rows) {
        return `<div class="table-wrap"><table><thead><tr><th>用途 / 时间</th><th>类目</th><th class="mobile-hide">账户</th><th class="amount">金额</th></tr></thead><tbody>${rows.map((x) => `<tr><td><strong>${esc(x.purpose)}</strong><small>${esc(x.time)}</small></td><td><span class="tag">${esc(x.category)}</span></td><td class="mobile-hide">${esc(x.account)}</td><td class="amount ${x.kind}">${x.kind === "income" ? "+" : "−"} ¥${money(x.amount)}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">没有符合条件的演示账目</td></tr>'}</tbody></table></div>`;
      }
      function navigate(next) {
        closeModal();
        page = next;
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function render() {
        $$("[data-page]").forEach((b) =>
          b.classList.toggle("active", b.dataset.page === page),
        );
        if (page === "overview") overview();
        else if (page === "ledger") ledger();
        else if (page === "pos") posPage();
        else if (page === "inventory") inventory();
        else orders();
      }
      function overview() {
        const t = totals();
        $("#content").innerHTML =
          header(
            "店铺总览",
            "把收支、收银和原料，放在同一本账里。",
            `<span class="tag">${date} · 示例日</span><button id="new-entry">＋ 试记一笔</button>`,
          ) +
          `<div class="grid stats"><section class="card featured"><div class="label">演示净支出</div><div class="metric"><i>¥</i>${money(t.expense)}</div><small>本页只演示基础收支</small></section><section class="card"><div class="label">演示收入</div><div class="metric"><i>¥</i>${money(t.income)}</div><small>销售收入与手动收入合计</small></section><section class="card"><div class="label">收支结余</div><div class="metric"><i>¥</i>${money(t.net)}</div><small>收入减支出，不等于经营利润</small></section><section class="card"><div class="label">需要补货</div><div class="metric">${t.low}<i> 项</i></div><small>按原料库存与补货线计算</small></section></div><div class="grid two-col"><section class="panel"><div class="panel-head"><h2>支出分类</h2><small>当前演示数据</small></div><div class="panel-body">${categoryBars()}</div></section><section class="panel"><div class="panel-head"><h2>可以怎样试用</h2><span class="tag good">无需登录</span></div><div class="panel-body"><ol class="tips"><li>试记一笔收支，查看总额与分类变化。</li><li>到模拟收银选择菜品，生成示例小票。</li><li>销售会按演示配方扣减原料，也可模拟盘点。</li><li>所有操作都可重置，不连接私人账本。</li></ol></div></section></div><section class="panel"><div class="panel-head"><h2>最近账目</h2><button id="all-ledger">查看全部 ↗</button></div>${txTable([...state.transactions].reverse().slice(0, 6))}</section><p class="footer-note">截图识别、关联退款、日总额核对和完整备份请在完整版使用。<a href="https://github.com/rookiemanui/codex/archive/refs/heads/main.zip">下载本地完整版</a> · <a href="https://github.com/rookiemanui/codex#readme" target="_blank" rel="noopener">查看使用说明</a></p>`;
        $("#new-entry").onclick = entryModal;
        $("#all-ledger").onclick = () => navigate("ledger");
      }
      function categoryBars() {
        const groups = {};
        state.transactions
          .filter((x) => x.kind === "expense")
          .forEach(
            (x) => (groups[x.category] = (groups[x.category] || 0) + x.amount),
          );
        const total = Object.values(groups).reduce((s, v) => s + v, 0);
        return (
          Object.entries(groups)
            .map(
              ([name, amount]) =>
                `<div class="bar"><div class="bar-label"><span>${esc(name)}</span><b>¥${money(amount)}</b></div><div class="bar-track"><div class="bar-fill" style="width:${total ? (amount / total) * 100 : 0}%"></div></div></div>`,
            )
            .join("") || '<p class="empty">暂无支出</p>'
        );
      }
      function ledger() {
        $("#content").innerHTML =
          header(
            "收支账目",
            "尝试搜索、筛选，或新增一笔演示收支。",
            '<button class="primary" id="new-entry">＋ 试记一笔</button>',
          ) +
          '<div class="search"><input id="search" aria-label="搜索演示账目" placeholder="搜索用途或类目"><select id="filter" aria-label="收支类型"><option value="all">全部收支</option><option value="income">收入</option><option value="expense">支出</option></select></div><section class="panel" id="ledger-table"></section><p class="footer-note">此处新增的是演示数据，刷新页面后还原。</p>';
        const draw = () => {
          const q = $("#search").value.toLowerCase(),
            kind = $("#filter").value;
          $("#ledger-table").innerHTML = txTable(
            [...state.transactions]
              .reverse()
              .filter(
                (x) =>
                  (kind === "all" || x.kind === kind) &&
                  (x.purpose + x.category).toLowerCase().includes(q),
              ),
          );
        };
        $("#search").oninput = draw;
        $("#filter").onchange = draw;
        $("#new-entry").onclick = entryModal;
        draw();
      }
      function modal(title, body) {
        $("#modal-root").innerHTML =
          `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button id="close-modal" aria-label="关闭">×</button></div><div class="modal-body">${body}</div></section></div>`;
        $("#close-modal").onclick = closeModal;
        $(".modal-backdrop").onclick = (e) => {
          if (e.target === e.currentTarget) closeModal();
        };
        $("input,select", $(".modal-body"))?.focus();
      }
      function closeModal() {
        $("#modal-root").innerHTML = "";
      }
      function cents(value) {
        if (!/^\d+(\.\d{1,2})?$/.test(value)) throw Error("金额最多两位小数");
        const [whole, fraction = ""] = value.split(".");
        const amount = Number(whole) * 100 + Number(fraction.padEnd(2, "0"));
        if (!Number.isSafeInteger(amount) || amount <= 0 || amount > 100000000)
          throw Error("演示金额应大于0且不超过100万元");
        return amount;
      }
      function entryModal() {
        modal(
          "试记一笔",
          `<div class="notice">仅添加到演示页，不写入真实账本。</div><form id="entry-form"><div class="form-grid"><label class="form-field">类型<select name="kind"><option value="expense">支出</option><option value="income">收入</option></select></label><label class="form-field">金额（元）<input name="amount" inputmode="decimal" required placeholder="例如 20.50"></label></div><label class="form-field">用途<input name="purpose" maxlength="80" required placeholder="例如 蔬菜采购"></label><div class="form-grid"><label class="form-field">类目<select name="category"><option>食材采购</option><option>调料采购</option><option>日常杂费</option></select></label><label class="form-field">账户<select name="account"><option>微信收款</option><option>支付宝收款</option><option>现金</option></select></label></div><div class="form-error" role="alert"></div><button class="primary full" type="submit">添加演示账目</button></form>`,
        );
        const form = $("#entry-form");
        $("[name=kind]", form).onchange = (e) => {
          $("[name=category]", form).innerHTML = (
            e.target.value === "income"
              ? ["销售收款", "其他收入"]
              : ["食材采购", "调料采购", "日常杂费"]
          )
            .map((x) => `<option>${x}</option>`)
            .join("");
        };
        form.onsubmit = (e) => {
          e.preventDefault();
          try {
            const data = Object.fromEntries(new FormData(form));
            const amount = cents(data.amount);
            if (!data.purpose.trim()) throw Error("请填写用途");
            state.transactions.push({
              ...data,
              amount,
              purpose: data.purpose.trim(),
              id: "demo-" + Date.now(),
              time: date + " 13:00",
            });
            closeModal();
            render();
            toast("已添加演示账目，刷新会还原");
          } catch (error) {
            $(".form-error", form).textContent = error.message;
          }
        };
      }
      function posPage() {
        $("#content").innerHTML =
          header("模拟收银", "选择菜品，试试金额合计和配方扣库。") +
          '<div class="notice">本页不连接支付平台。确认模拟销售不会向任何人扣款。</div><div class="grid pos-grid"><section class="panel"><div class="panel-body"><form class="search" id="code-form"><input id="dish-code" aria-label="菜品编码" placeholder="输入演示编码 1001 / 1002 / 1003"><button type="submit">加入</button></form><div class="grid menu-grid">' +
          dishes
            .map(
              (d) =>
                `<button class="dish" data-dish="${d.id}"><strong>${d.name}</strong><b>¥${money(d.price)}</b><small>${d.code} · 按演示配方扣库</small></button>`,
            )
            .join("") +
          '</div></div></section><section class="panel"><div class="panel-head"><h2>演示购物车</h2><button id="clear-cart">清空</button></div><div class="panel-body" id="cart"></div></section></div>';
        $$("[data-dish]").forEach(
          (b) => (b.onclick = () => addDish(b.dataset.dish)),
        );
        $("#clear-cart").onclick = () => {
          cart = [];
          drawCart();
        };
        $("#code-form").onsubmit = (e) => {
          e.preventDefault();
          const d = dishes.find((x) => x.code === $("#dish-code").value.trim());
          if (d) {
            addDish(d.id);
            $("#dish-code").value = "";
          } else toast("请使用演示编码1001、1002或1003");
        };
        drawCart();
      }
      function addDish(id) {
        const old = cart.find((x) => x.id === id);
        if (old) {
          if (old.quantity >= 99) return toast("演示每种最多99份");
          old.quantity++;
        } else cart.push({ id, quantity: 1 });
        drawCart();
      }
      function drawCart() {
        const total = cart.reduce(
          (s, x) => s + dishes.find((d) => d.id === x.id).price * x.quantity,
          0,
        );
        $("#cart").innerHTML =
          cart
            .map((x) => {
              const d = dishes.find((d) => d.id === x.id);
              return `<div class="cart-row"><div><strong>${d.name}</strong><small>¥${money(d.price)} / 份</small></div><div class="qty"><button data-minus="${x.id}" aria-label="减少${d.name}">−</button><span>${x.quantity}</span><button data-plus="${x.id}" aria-label="增加${d.name}">+</button></div></div>`;
            })
            .join("") +
          (cart.length
            ? ""
            : '<div class="empty">点选菜品或输入演示编码</div>') +
          `<div class="cart-total"><span>合计</span><strong>¥${money(total)}</strong></div><label class="form-field">演示收款方式<select id="payment"><option>微信收款</option><option>现金</option><option>支付宝收款</option></select></label><button id="checkout" class="primary full" ${cart.length ? "" : "disabled"}>确认模拟销售</button>`;
        $$("[data-minus]").forEach(
          (b) =>
            (b.onclick = () => {
              cart.find((x) => x.id === b.dataset.minus).quantity--;
              cart = cart.filter((x) => x.quantity > 0);
              drawCart();
            }),
        );
        $$("[data-plus]").forEach(
          (b) => (b.onclick = () => addDish(b.dataset.plus)),
        );
        $("#checkout").onclick = checkout;
      }
      function checkout() {
        if (!cart.length) return;
        const needed = {};
        for (const x of cart) {
          const d = dishes.find((d) => d.id === x.id);
          for (const [id, q] of Object.entries(d.recipe))
            needed[id] = (needed[id] || 0) + q * x.quantity;
        }
        for (const [id, q] of Object.entries(needed)) {
          const p = state.stock.find((x) => x.id === id);
          if (p.milli < q)
            return toast(
              "演示库存不足：" + p.name + "。本单没有新增账目或扣库。",
            );
        }
        const lines = cart.map((x) => {
          const d = dishes.find((d) => d.id === x.id);
          return { name: d.name, price: d.price, quantity: x.quantity };
        });
        const total = lines.reduce((s, x) => s + x.price * x.quantity, 0);
        const account = $("#payment").value,
          number = "DEMO-" + String(state.orders.length + 1).padStart(3, "0");
        for (const [id, q] of Object.entries(needed))
          state.stock.find((x) => x.id === id).milli -= q;
        const order = { number, lines, total, account, time: date + " 13:05" };
        state.orders.push(order);
        state.transactions.push({
          id: number,
          kind: "income",
          amount: total,
          purpose: "销售小票 " + number,
          category: "销售收款",
          account,
          time: order.time,
        });
        cart = [];
        drawCart();
        showTicket(order);
        toast("模拟销售已保存到此标签页，未发生真实扣款");
      }
      function inventory() {
        $("#content").innerHTML =
          header("原料库存", "按原料单位管理数量，避免从消费金额推测库存。") +
          `<section class="panel"><div class="table-wrap"><table><thead><tr><th>原料 / 编码</th><th>当前数量</th><th class="mobile-hide">补货线</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.stock.map((x) => `<tr><td><strong>${x.name}</strong><small>${x.code}</small></td><td>${qty(x.milli)} ${x.unit}</td><td class="mobile-hide">${qty(x.minimum)} ${x.unit}</td><td><span class="tag ${x.milli <= x.minimum ? "warn" : "good"}">${x.milli <= x.minimum ? "建议补货" : "库存正常"}</span></td><td><button data-adjust="${x.id}">模拟盘点</button></td></tr>`).join("")}</tbody></table></div></section><p class="footer-note">演示配方：宫保鸡丁每份用鸡肉0.2千克，番茄炒蛋每份用番茄0.15千克，米饭每份用大米0.1千克。</p>`;
        $$("[data-adjust]").forEach(
          (b) => (b.onclick = () => adjust(b.dataset.adjust)),
        );
      }
      function adjust(id) {
        const product = state.stock.find((x) => x.id === id);
        modal(
          "模拟盘点",
          `<p>${product.name} · 单位：${product.unit}</p><form id="adjust-form"><label class="form-field">盘点后数量<input name="quantity" inputmode="decimal" required value="${qty(product.milli).replace(/,/g, "")}"></label><p class="muted">只调整演示库存，不新增采购或销售账目。</p><div class="form-error" role="alert"></div><button class="primary full" type="submit">保存演示数量</button></form>`,
        );
        $("#adjust-form").onsubmit = (e) => {
          e.preventDefault();
          const value = $("[name=quantity]", e.target).value.trim();
          if (!/^\d+(\.\d{1,3})?$/.test(value)) {
            $(".form-error", e.target).textContent =
              "数量最多三位小数，不能为负数";
            return;
          }
          const [whole, fraction = ""] = value.split(".");
          const milli = Number(whole) * 1000 + Number(fraction.padEnd(3, "0"));
          if (!Number.isSafeInteger(milli) || milli > 1000000000) {
            $(".form-error", e.target).textContent = "演示数量过大";
            return;
          }
          product.milli = milli;
          closeModal();
          render();
          toast("演示数量已更新");
        };
      }
      function orders() {
        $("#content").innerHTML =
          header("销售小票", "查看演示销售明细，试用浏览器打印。") +
          `<section class="panel"><div class="table-wrap"><table><thead><tr><th>小票 / 时间</th><th class="mobile-hide">收款方式</th><th>合计</th><th>操作</th></tr></thead><tbody>${[
            ...state.orders,
          ]
            .reverse()
            .map(
              (o) =>
                `<tr><td><strong>${o.number}</strong><small>${o.time}</small></td><td class="mobile-hide">${o.account}</td><td>¥${money(o.total)}</td><td><button data-ticket="${o.number}">查看小票</button></td></tr>`,
            )
            .join(
              "",
            )}</tbody></table></div></section><p class="footer-note">演示小票只供预览，不对应实际交易，不是税务发票。</p>`;
        $$("[data-ticket]").forEach(
          (b) =>
            (b.onclick = () =>
              showTicket(
                state.orders.find((x) => x.number === b.dataset.ticket),
              )),
        );
      }
      function showTicket(order) {
        modal(
          "示例销售小票",
          `<div class="print-tools"><button id="print" class="primary full">打印示例小票 / 保存PDF</button><p class="muted">打印纸宽可选择80毫米，或保存为PDF。</p></div><article class="ticket"><h2>示例餐饮店</h2><h3>演示销售小票</h3><p>单号：${order.number}<br>时间：${order.time}</p><table><thead><tr><th>菜品</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody>${order.lines.map((x) => `<tr><td>${x.name}</td><td>${x.quantity}</td><td>${money(x.price)}</td><td>${money(x.price * x.quantity)}</td></tr>`).join("")}</tbody></table><div class="ticket-total">合计 ¥${money(order.total)}</div><p>演示方式：${order.account}</p><p>演示数据，无真实交易。<br>本页未向任何人发起扣款。<br>仅供试用，不可作为报销凭证。</p></article>`,
        );
        $("#print").onclick = () => window.print();
      }
      $$("[data-page]").forEach(
        (b) => (b.onclick = () => navigate(b.dataset.page)),
      );
      $("#reset").onclick = () => {
        seed();
        closeModal();
        render();
        toast("演示已重置，不影响任何真实账本");
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
      seed();
      render();
    </script>
  </body>
</html>
