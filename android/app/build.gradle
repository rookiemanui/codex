plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaoguo.ledger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xiaoguo.ledger'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
